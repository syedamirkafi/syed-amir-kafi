<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #121212; color: #fdfdfd; font-family: "Inter Tight", Arial, sans-serif; overflow: hidden; position: relative; }
  .frame { position: absolute; inset: 24px; border: 4px solid #f4b400; }
  .tag { position: absolute; top: 44px; left: 48px; font-family: "Courier New", monospace; font-size: 26px; letter-spacing: 6px; color: #f4b400; text-transform: uppercase; }
  .name { position: absolute; left: 48px; bottom: 120px; font-weight: 900; font-size: 88px; line-height: 0.92; text-transform: uppercase; letter-spacing: -3px; }
  .sub { position: absolute; left: 48px; bottom: 60px; font-size: 28px; color: #fdfdfd; max-width: 820px; line-height: 1.3; }
  .coords { position: absolute; right: 48px; top: 44px; font-family: "Courier New", monospace; font-size: 22px; color: #fdfdfd; opacity: 0.7; letter-spacing: 2px; text-transform: uppercase; }
  .blob { position: absolute; right: -80px; bottom: -120px; width: 480px; height: 480px; border-radius: 50%; background: radial-gradient(circle, rgba(244,180,0,0.55), rgba(244,180,0,0) 70%); }
</style>
</head>
<body>
  <div class="blob"></div>
  <div class="frame"></div>
  <div class="coords">N 51.669 / E 7.821</div>
  <div class="tag">/// PERSONAL SITE</div>
  <div class="name">SYED AMIR KAFI</div>
  <div class="sub">Data analytics · business analysis · operations · design</div>
</body>
</html>
