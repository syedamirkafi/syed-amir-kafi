<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #fafaf8; color: #161513; font-family: "Inter", Arial, sans-serif; overflow: hidden; position: relative; }
  .rule { position: absolute; height: 2px; background: #F4B400; }
  .rule.top { top: 84px; left: 80px; width: 64px; }
  .rule.bottom { left: 80px; bottom: 96px; width: 240px; height: 1px; background: #e6e3da; }
  .tag { position: absolute; top: 100px; left: 80px; font-size: 22px; letter-spacing: 6px; color: #4a3c00; text-transform: uppercase; font-weight: 600; }
  .name { position: absolute; left: 80px; bottom: 150px; font-weight: 500; font-size: 96px; line-height: 0.98; letter-spacing: -0.015em; max-width: 1040px; font-family: "Fraunces", "Times New Roman", Georgia, serif; }
  .sub { position: absolute; left: 80px; bottom: 112px; font-size: 26px; color: #5c594f; max-width: 1040px; line-height: 1.35; font-family: "Fraunces", "Times New Roman", Georgia, serif; font-style: italic; }
  .footer { position: absolute; left: 80px; bottom: 56px; font-size: 20px; color: #8c8a82; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; }
  .dot { position: absolute; top: 58px; right: 80px; display: flex; align-items: center; gap: 12px; font-size: 18px; color: #4a3c00; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
  .dot i { width: 12px; height: 12px; border-radius: 50%; background: #F4B400; }
</style>
</head>
<body>
  <div class="dot"><i></i>Open to BA roles · Germany</div>
  <div class="rule top"></div>
  <div class="tag">Business Analyst</div>
  <div class="name">Syed Amir<br>Kafi.</div>
  <div class="sub">Requirements, dashboards, and process work for digital transformation.</div>
  <div class="rule bottom"></div>
  <div class="footer">M.A. International Management & Information Systems · Hamm, Germany</div>
</body>
</html>
